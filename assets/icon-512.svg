<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1614"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="m" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.18" r="0.5">
      <stop offset="0%" stop-color="rgba(52,211,153,0.35)"/>
      <stop offset="100%" stop-color="rgba(52,211,153,0)"/>
    </radialGradient>
    <radialGradient id="sparkGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="rgba(52,211,153,0.8)"/>
      <stop offset="100%" stop-color="rgba(52,211,153,0)"/>
    </radialGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Base card -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="rgba(16,185,129,0.20)" stroke-width="2"/>
  <rect width="512" height="512" rx="112" fill="url(#halo)"/>

  <!-- Subtle dotted constellation background -->
  <g fill="rgba(255,255,255,0.04)">
    <circle cx="86"  cy="92"  r="2"/>
    <circle cx="420" cy="120" r="2"/>
    <circle cx="64"  cy="370" r="2"/>
    <circle cx="438" cy="386" r="2"/>
    <circle cx="128" cy="438" r="1.5"/>
    <circle cx="370" cy="68"  r="1.5"/>
  </g>

  <!-- Sparkle glow halo -->
  <circle cx="256" cy="128" r="64" fill="url(#sparkGlow)" filter="url(#soft)"/>

  <!-- M monogram -->
  <g stroke="url(#m)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="112" y1="384" x2="112" y2="192"/>
    <line x1="112" y1="192" x2="192" y2="320"/>
    <line x1="192" y1="320" x2="256" y2="224"/>
    <line x1="256" y1="224" x2="320" y2="320"/>
    <line x1="320" y1="320" x2="400" y2="192"/>
    <line x1="400" y1="192" x2="400" y2="384"/>
  </g>

  <!-- Sparkle (miracle moment) -->
  <g transform="translate(256 128)" fill="#34D399">
    <path d="M0 -42 L10 -10 L42 0 L10 10 L0 42 L-10 10 L-42 0 L-10 -10 Z"/>
  </g>
  <circle cx="256" cy="128" r="8" fill="#FFFFFF" opacity="0.7"/>

  <!-- Small accent dots flanking the sparkle -->
  <circle cx="200" cy="128" r="3" fill="#34D399" opacity="0.6"/>
  <circle cx="312" cy="128" r="3" fill="#34D399" opacity="0.6"/>
</svg>
