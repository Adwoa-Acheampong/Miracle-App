<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1614"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="m" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.32" r="0.4">
      <stop offset="0%" stop-color="rgba(52,211,153,0.30)"/>
      <stop offset="100%" stop-color="rgba(52,211,153,0)"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed background (no rounded corners — OS masks for us) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#halo)"/>

  <!-- Safe zone is center 80% (102→410). Mark stays inside. -->
  <!-- M monogram, scaled smaller to fit safe zone -->
  <g stroke="url(#m)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="156" y1="368" x2="156" y2="216"/>
    <line x1="156" y1="216" x2="216" y2="312"/>
    <line x1="216" y1="312" x2="256" y2="248"/>
    <line x1="256" y1="248" x2="296" y2="312"/>
    <line x1="296" y1="312" x2="356" y2="216"/>
    <line x1="356" y1="216" x2="356" y2="368"/>
  </g>

  <!-- Sparkle (centered above M) -->
  <g transform="translate(256 168)" fill="#34D399">
    <path d="M0 -32 L8 -8 L32 0 L8 8 L0 32 L-8 8 L-32 0 L-8 -8 Z"/>
  </g>
  <circle cx="256" cy="168" r="6" fill="#FFFFFF" opacity="0.7"/>
</svg>
