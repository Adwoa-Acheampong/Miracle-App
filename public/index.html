  <!--
    Boot self-heal: if main.js throws a ReferenceError on load (cache poisoning —
    old SW serving stale main.js that references browser APIs the current Safari
    runtime doesn't have, e.g. requestIdleCallback), unregister all service workers,
    purge caches, and hard-reload. Runs at most once per session so we don't loop.
  -->
  <script>
    (function () {
      var KEY = 'miracle_cache_heal_attempt';
      window.addEventListener('error', function (e) {
        var msg = (e && (e.message || e.error?.message)) || '';
        if (!/Can't find variable|is not defined|ReferenceError/i.test(msg)) return;
        if (sessionStorage.getItem(KEY)) return; // already tried once this session
        sessionStorage.setItem(KEY, '1');
        Promise.resolve()
          .then(function () { return navigator.serviceWorker ? navigator.serviceWorker.getRegistrations() : []; })
          .then(function (regs) { return Promise.all(regs.map(function (r) { return r.unregister(); })); })
          .then(function () { return window.caches ? caches.keys() : []; })
          .then(function (keys) { return Promise.all(keys.map(function (k) { return caches.delete(k); })); })
          .finally(function () {
            location.replace(location.pathname + '?healed=' + Date.now());
          });
      });
    })();
  </script>
  <!-- ?v=__BUILD__ is rewritten by server.js per-deploy. Cache-bust without manual bumps. -->
  <script type="module" src="./main.js?v=__BUILD__"></script>
</body>
