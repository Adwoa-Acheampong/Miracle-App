<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0A0C"/>
      <stop offset="55%" stop-color="#0F1419"/>
      <stop offset="100%" stop-color="#0A0A0C"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.7" cy="0.3" r="0.8">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="0.15" cy="0.85" r="0.6">
      <stop offset="0%" stop-color="#7B2FF2" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7B2FF2" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .word { font-family: 'Cormorant Garamond', 'EB Garamond', Georgia, serif; font-weight: 500; }
      .meta { font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .body { font-family: 'Inter', system-ui, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#orb)"/>
  <rect width="1200" height="630" fill="url(#orb2)"/>

  <!-- Constellation dots (subtle texture) -->
  <g fill="#FFFFFF" opacity="0.08">
    <circle cx="180"  cy="120" r="1.2"/>
    <circle cx="980"  cy="80"  r="1.5"/>
    <circle cx="1080" cy="200" r="1"/>
    <circle cx="120"  cy="480" r="1.3"/>
    <circle cx="1100" cy="510" r="1"/>
    <circle cx="60"   cy="300" r="1.1"/>
    <circle cx="850"  cy="540" r="1.4"/>
    <circle cx="420"  cy="60"  r="1"/>
    <circle cx="680"  cy="120" r="1.2"/>
  </g>

  <!-- Frame border -->
  <rect x="40" y="40" width="1120" height="550" rx="20" fill="none" stroke="rgba(16,185,129,0.18)" stroke-width="1"/>
  <rect x="48" y="48" width="1104" height="534" rx="14" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Emerald star mark -->
  <g transform="translate(180 200)" fill="#10B981" filter="url(#glow)">
    <path d="M0 -54 L9 -9 L54 0 L9 9 L0 54 L-9 9 L-54 0 L-9 -9 Z"/>
  </g>

  <!-- Wordmark -->
  <text class="word" x="280" y="220" font-size="108" fill="#F5F4F0" letter-spacing="-2">miracle</text>

  <!-- Subline -->
  <text class="meta" x="282" y="262" font-size="18" fill="#10B981" letter-spacing="3">PERSONAL · COGNITIVE · SYSTEM</text>

  <!-- Divider -->
  <line x1="100" y1="340" x2="1100" y2="340" stroke="rgba(16,185,129,0.25)" stroke-width="0.6"/>
  <text x="600" y="346" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" fill="#10B981">◆</text>

  <!-- Tagline (catchy summary) -->
  <text class="word" x="100" y="430" font-size="52" fill="#F5F4F0" font-style="italic">faith × follow-through.</text>
  <text class="body" x="100" y="486" font-size="26" fill="rgba(245,244,240,0.78)">journal · pray · build · steward — one cognitive system for operators</text>
  <text class="body" x="100" y="520" font-size="26" fill="rgba(245,244,240,0.78)">who refuse to split the spiritual from the strategic.</text>

  <!-- Footer pills -->
  <g transform="translate(100 558)" class="meta" font-size="14" fill="rgba(245,244,240,0.55)">
    <text x="0" y="0">miracleapp.site</text>
    <text x="200" y="0" fill="#10B981">●</text>
    <text x="215" y="0">17 stores</text>
    <text x="320" y="0" fill="#10B981">●</text>
    <text x="335" y="0">offline-first PWA</text>
    <text x="500" y="0" fill="#10B981">●</text>
    <text x="515" y="0">nes ai · standalone agent</text>
  </g>

  <!-- Top-right meta -->
  <text class="meta" x="1100" y="100" text-anchor="end" font-size="12" fill="rgba(255,255,255,0.35)" letter-spacing="2">FOR THE BUILDER · FOR THE BELIEVER</text>
</svg>
